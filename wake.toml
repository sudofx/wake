# WAKE✳︎ MAINTAINER NOTE
# Runtime configuration. Provider, cadence, quota, and capacity values alter operation but must not silently redefine accepted history.
# Comments here document operational intent so future maintainers do not mistake configuration for experimental evidence.

timezone = "America/Los_Angeles"
objective = "Test whether durable state and mechanically enforced rules can make fresh model invocations act as one accountable process."
provider = "gemini"
model = "gemini-3.1-flash-lite"
# Flash Lite handles normal operation. Newer models unlock only after Google's exact Lite daily free-tier quota is exhausted.
gemini_fallback_models = ["gemini-3.8-flash", "gemini-3.5-flash"]
gemini_fallback_requires_primary_daily_quota = true
# Legacy aggregate ceiling for compatibility. Live Gemini budgeting uses the per-model RPD buckets below.
daily_call_limit = 500
model_daily_call_limits = { "gemini-3.1-flash-lite" = 500, "gemini-3.8-flash" = 20, "gemini-3.5-flash" = 20 }
# Routine derived working memory; shadow restores rich delivery with overflow fallback.
memory_mode = "active"
max_context_chars = 48000
max_output_tokens = 8192
# Allow bounded planning and answer responses to finish during transient latency.
timeout_seconds = 45
# Explicit opt-in: use an API project with billing disabled.
free_tier_confirmed = true
project_name = "WAKE✳︎"
research_topics_file = "research-topics.toml"
mission = "Independently choose small, useful research projects from the configured topics. Look for structural relationships without assuming they exist. Develop source-backed notebooks, compare explanations, preserve uncertainty, revise weak claims, finish useful work, and choose the next step without waiting for human assignments. Distinguish findings, interpretation, analogy, and speculation."
editorial_notes = []
# Leave observational until 20 accepted scored charter cycles have been reviewed.
inquiry_drive_enabled = false
# Overnight observation profile: collect a wider, still bounded sample and
# expose rejected proposals as explicit counterfactual receipts for review.
observation_mode = true
# Plan, retrieve routing hops immediately, then submit one governed proposal.
# Google Search is available only during recorded research planning.
# Grounding results remain discovery leads, not independently collected evidence.
# Disabled until this API project has grounding quota; public Bing discovery is independent.
research_google_search = false
same_wake_research = true
research_collection_budget = 6
repository = "sudofx/wake"
