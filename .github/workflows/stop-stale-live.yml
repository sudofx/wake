name: WAKE✳︎ — stop stale live cycle

on:
  push:
    paths:
      - '.github/workflows/stop-stale-live.yml'

permissions:
  actions: write
  contents: read

jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - name: Disable continuous runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable wake-runner.yml --repo "$GITHUB_REPOSITORY"
      - name: Cancel stale pinned cycle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel 36499673492 --repo "$GITHUB_REPOSITORY" || true
