name: WAKE✳︎ — Deploy uploaded mirror (manual recovery)

# Normal hosting publishes wake-public directly through Pages branch hosting.
# This optional recovery path only deploys already prepared public files.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: wake-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: wake-public
          path: site
      - name: Verify prepared mirror
        run: test -f site/index.html && test -f site/installation.json && test -f site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy prepared mirror
        id: deployment
        uses: actions/deploy-pages@v4
