name: WAKE✳︎ — publish Pages

# Static application-shell publication only. Cycles never dispatch this workflow.
on:
  push:
    branches: [master]
    paths:
      - 'wake/assets/**'
      - 'wake/report.py'
      - 'wake/provenance.py'
      - 'wake/rejected.py'
      - 'wake/feeds.py'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'wake/live.py'
      - 'scripts/publish_pages.py'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wake-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      WAKE_CONTROL_URL: ${{ vars.WAKE_CONTROL_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install WAKE runtime dependencies
        run: python -m pip install --disable-pip-version-check -e .
      - name: Render static application shell from wake-live
        run: python scripts/publish_pages.py
      - name: Confirm report is ready
        run: test -f site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish interface
        id: deployment
        uses: actions/deploy-pages@v4
