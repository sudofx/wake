name: WAKE — Verify hosted runtime upgrade
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Full candidate commit; verification never starts research.
        type: string
        required: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: control
      - id: policy
        run: |
          python - <<'PY'
          import json,os
          p=json.load(open('control/hosted-runtime.json'))['installations'][os.environ['GITHUB_REPOSITORY']]
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('baseline='+p['source_revision']+'\n')
          PY
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate }}
          path: candidate
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.policy.outputs.baseline }}
          path: baseline
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check -e './candidate[hosted]'
      - name: Restore disposable copies and compare all twelve full audits
        env:
          GH_TOKEN: ${{ github.token }}
          WAKE_HOSTED_STATE_KEY: ${{ secrets.WAKE_HOSTED_STATE_KEY }}
        run: python control/scripts/verify_hosted_upgrade.py --candidate candidate --baseline baseline --policy control/hosted-runtime.json --output upgrade-verification.json
      - uses: actions/upload-artifact@v6
        with:
          name: upgrade-verification
          path: upgrade-verification.json
          retention-days: 7
