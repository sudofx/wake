name: WAKE✳︎ — Check code · automatic

on:
  push:
    branches: [master]
    paths:
      - 'wake/**/*.py'
      - 'wake/assets/**'
      - 'scripts/**/*.py'
      - 'tests/**'
      - 'examples/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose*.yaml'
      - 'deploy/**'
      - 'wake.toml'
      - 'pyproject.toml'
      - 'research-topics.toml'
      - 'example.research-topics.toml'
      - '.gitignore'
      - '.github/workflows/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wake-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install WAKE runtime dependencies
        run: python -m pip install --disable-pip-version-check -e '.[hosted]'
      - name: Prepare the explicit research-topic fixture
        run: cp example.research-topics.toml research-topics.toml
      - name: Check that code and architecture rules still work
        run: python -m unittest discover -s tests -v
      - name: Check hosted activity privacy and freshness
        run: |
          node --test deploy/activity-relay/tests/relay.test.js
          node tests/browser/hosted-activity-unit.cjs
      - name: Simulate 100 WAKE cycles
        if: github.event_name != 'push'
        run: python -m wake --data /tmp/wake-experiment experiment --cycles 100 --output site
      - name: Verify the simulated durable record
        if: github.event_name != 'push'
        run: python -m wake audit --events site/events.jsonl --head site/head.txt
      - name: Upload verified journal
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: verified-journal-python-${{ matrix.python }}
          path: site/
