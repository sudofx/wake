# WAKE✳︎ MAINTAINER NOTE
# CI safety net. Fast push checks catch implementation regressions without
# turning every small commit into a full longitudinal experiment. The expensive
# 100-cycle verification remains available on pull requests and manual dispatch.

name: Verify the record
on:
  push:
    branches-ignore: [wake-state, journal-pages]
    paths:
      - 'wake/**/*.py'
      - 'scripts/**/*.py'
      - 'tests/**'
      - 'wake.toml'
      - 'research-topics.toml'
      - '.github/workflows/test.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      # Longitudinal verification is intentionally not a per-push tax.
      # Run it when reviewing a PR or when an operator explicitly requests it.
      - name: Run 100-cycle verification experiment
        if: github.event_name != 'push'
        run: python -m wake --data /tmp/wake-experiment experiment --cycles 100 --output site
      - name: Audit verification experiment
        if: github.event_name != 'push'
        run: python -m wake audit --events site/events.jsonl --head site/head.txt
      - name: Upload verified journal
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: verified-journal-python-${{ matrix.python }}
          path: site/
