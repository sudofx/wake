name: Verify the record

on:
  push:
    branches-ignore: [wake-state, wake-live, wake-runtime, journal-pages]
    paths:
      - 'wake/**/*.py'
      - 'wake/assets/**'
      - 'scripts/**/*.py'
      - 'tests/**'
      - 'wake.toml'
      - 'research-topics.toml'
      - '.github/workflows/**'
      - 'control-worker/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wake-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run fast unit and architecture tests
        run: python -m unittest discover -s tests -v
      - name: Run 100-cycle verification experiment
        if: github.event_name != 'push'
        run: python -m wake --data /tmp/wake-experiment experiment --cycles 100 --output site
      - name: Audit verification experiment
        if: github.event_name != 'push'
        run: python -m wake audit --events site/events.jsonl --head site/head.txt
      - name: Upload verified journal
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: verified-journal-python-${{ matrix.python }}
          path: site/
