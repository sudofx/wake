name: WAKE✳︎ - Start
run-name: "Start WAKE✳︎"

# ELI5: Press this when you want WAKE✳︎ to start working and keep going.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: wake-operator-control
  cancel-in-progress: false

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Make sure WAKE✳︎ is not already running
        id: status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/wake.yml/runs?branch=wake-runtime&per_page=50"             --jq '[.workflow_runs[] | select(.head_branch=="wake-runtime" and .status!="completed")] | length')"
          echo "active=$active" >> "$GITHUB_OUTPUT"

      - name: Open the continuation latch
        if: steps.status.outputs.active == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/wake-runner.yml/enable" >/dev/null

      - name: Start the first research cycle
        if: steps.status.outputs.active == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runtime_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/wake-runtime" --jq '.object.sha')"
          gh workflow run wake.yml --repo "$GITHUB_REPOSITORY" --ref wake-runtime             -f "dispatch_token=start-$GITHUB_RUN_ID"             -f "runtime_ref=$runtime_ref"

      - name: Explain the result
        if: always()
        run: |
          if [[ "${{ steps.status.outputs.active }}" == "0" ]]; then
            echo "WAKE✳︎ was told to start. The first research cycle was dispatched and the continuation latch is open." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WAKE✳︎ was already running, so nothing was duplicated." >> "$GITHUB_STEP_SUMMARY"
          fi
