name: repair-hosted-startup
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['.github/workflows/repair-hosted-startup.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: wake-startup-repair-request
  cancel-in-progress: false
jobs:
  request:
    if: github.ref_name == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check -e '.[hosted]'
      - name: Audit the drained checkpoint and require exact startup proof before requesting promotion
        env:
          GH_TOKEN: ${{ github.token }}
          WAKE_HOSTED_STATE_KEY: ${{ secrets.WAKE_HOSTED_STATE_KEY }}
          WAKE_HOSTED_STATE_DIR: /tmp/wake-repair-request
          WAKE_REPAIR_STOP_RUN: '42338840262'
        run: python scripts/request_hosted_startup_repair.py
