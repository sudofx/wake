name: WAKE✳︎ — promote runtime
run-name: "Promote runtime · ${{ inputs.candidate_ref }}"

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Verified commit/branch to promote into wake-runtime
        type: string
        required: true
        default: master

permissions:
  contents: write
  actions: read

concurrency:
  group: wake-runtime-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Refuse promotion while runtime work is active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/wake.yml/runs?branch=wake-runtime&per_page=50" \
            --jq '[.workflow_runs[] | select(.head_branch=="wake-runtime" and .status!="completed")] | length')"
          if [[ "$active" != "0" ]]; then
            echo "::error::wake-runtime is active. Stop WAKE✳︎, promote, then restart."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install candidate
        run: python -m pip install --disable-pip-version-check -e .

      - name: Verify durable contracts
        run: python -m unittest discover -s tests -v

      - name: Verify replayable experiment boundary
        run: |
          rm -rf /tmp/wake-promote /tmp/wake-promote-site
          python -m wake --data /tmp/wake-promote experiment --cycles 20 --output /tmp/wake-promote-site
          python -m wake audit --events /tmp/wake-promote-site/events.jsonl --head /tmp/wake-promote-site/head.txt

      - name: Recheck runtime is still stopped
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/wake.yml/runs?branch=wake-runtime&per_page=50" \
            --jq '[.workflow_runs[] | select(.head_branch=="wake-runtime" and .status!="completed")] | length')"
          if [[ "$active" != "0" ]]; then
            echo "::error::wake-runtime became active during verification. Stop WAKE✳︎ and retry promotion."
            exit 1
          fi

      - name: Promote exact verified commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/wake.yml/runs?branch=wake-runtime&per_page=50" \
            --jq '[.workflow_runs[] | select(.head_branch=="wake-runtime" and .status!="completed")] | length')"
          if [[ "$active" != "0" ]]; then
            echo "::error::wake-runtime became active before promotion. Stop WAKE✳︎ and retry."
            exit 1
          fi
          candidate_sha="$(git rev-parse HEAD)"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/wake-runtime" \
            -f sha="$candidate_sha" -F force=true >/dev/null
          promoted="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/wake-runtime" --jq '.object.sha')"
          test "$promoted" = "$candidate_sha"
          echo "Promoted wake-runtime to $promoted" >> "$GITHUB_STEP_SUMMARY"
          echo "Runtime remains stopped. Restart explicitly from operator controls." >> "$GITHUB_STEP_SUMMARY"
