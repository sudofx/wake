name: WAKE✳︎ — Phase E production migration rehearsal

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/phase-e-production-rehearsal.yml'

permissions:
  contents: read

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check -e .
      - name: Fetch current WAKE authority
        run: |
          git fetch --depth=1 origin wake-state
          mkdir -p /tmp/wake-legacy/data /tmp/wake-migrated/data
          git show FETCH_HEAD:data/wake.sqlite3 > /tmp/wake-legacy/data/wake.sqlite3
      - name: Rehearse exact migration without provider access
        run: |
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          from wake.store import Store
          from wake.sudofx_store import SudofxStore

          legacy_dir = Path("/tmp/wake-legacy/data")
          migrated_dir = Path("/tmp/wake-migrated/data")
          legacy_bytes = (legacy_dir / "wake.sqlite3").stat().st_size
          legacy = Store(legacy_dir)
          started = time.monotonic()
          try:
              store = SudofxStore(migrated_dir, legacy_store=legacy)
          finally:
              legacy.close()
          migration_seconds = time.monotonic() - started
          try:
              state = store.load()
              event_count = len(store.events())
              head = store.head()
              revision = store.kernel.context().revision
              migration = store._envelope()["migration"]
          finally:
              store.close()

          reopened = SudofxStore(migrated_dir)
          try:
              assert reopened.head() == head
              assert len(reopened.events()) == event_count
              assert reopened.load() == state
          finally:
              reopened.close()

          sudofx_bytes = (migrated_dir / "sudofx.sqlite").stat().st_size
          result = {
              "legacy_bytes": legacy_bytes,
              "sudofx_bytes": sudofx_bytes,
              "growth_ratio": round(sudofx_bytes / max(legacy_bytes, 1), 4),
              "migration_seconds": round(migration_seconds, 3),
              "event_count": event_count,
              "sudofx_revision": revision,
              "archive_complete": migration.get("archive_complete"),
              "github_100mb_safe": sudofx_bytes < 100 * 1024 * 1024,
          }
          print(json.dumps(result, sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("## Phase E migration rehearsal\n\n")
              for key, value in result.items():
                  out.write(f"- **{key}**: {value}\n")
          if not result["github_100mb_safe"]:
              raise SystemExit("Migrated sudofx.sqlite exceeds GitHub's 100 MiB safety ceiling")
          PY
