name: WAKE✳︎ — Phase E authority rehearsal

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/phase-e-production-rehearsal.yml'
      - 'pyproject.toml'
      - 'wake/authority.py'
      - 'wake/sudofx_store.py'
      - 'wake/sudofx_application.py'
      - 'wake/application_policy.py'
      - 'wake/engine.py'
      - 'wake/history.py'
      - 'wake/live.py'
      - 'scripts/github_wake.py'
      - 'tests/test_authority_cutover.py'
      - 'tests/test_cloud_workflow.py'
      - 'tests/test_sudofx_migration.py'
      - 'tests/test_system.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wake-phase-e-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check -e .
      - name: Fetch current WAKE authority
        run: |
          git fetch --depth=1 origin wake-state
          mkdir -p /tmp/wake-authority/data
          if git cat-file -e FETCH_HEAD:data/sudofx.sqlite.gz 2>/dev/null; then
            git show FETCH_HEAD:data/sudofx.sqlite.gz > /tmp/wake-authority/data/sudofx.sqlite.gz
            checkpoint_bytes="$(stat -c %s /tmp/wake-authority/data/sudofx.sqlite.gz)"
            gzip -dc /tmp/wake-authority/data/sudofx.sqlite.gz > /tmp/wake-authority/data/sudofx.sqlite
            rm /tmp/wake-authority/data/sudofx.sqlite.gz
            echo "checkpoint_bytes=$checkpoint_bytes" >> "$GITHUB_ENV"
            echo "source_format=sudofx" >> "$GITHUB_ENV"
          elif git cat-file -e FETCH_HEAD:data/sudofx.sqlite 2>/dev/null; then
            git show FETCH_HEAD:data/sudofx.sqlite > /tmp/wake-authority/data/sudofx.sqlite
            checkpoint_bytes="$(stat -c %s /tmp/wake-authority/data/sudofx.sqlite)"
            echo "checkpoint_bytes=$checkpoint_bytes" >> "$GITHUB_ENV"
            echo "source_format=sudofx" >> "$GITHUB_ENV"
          elif git cat-file -e FETCH_HEAD:data/wake.sqlite3 2>/dev/null; then
            git show FETCH_HEAD:data/wake.sqlite3 > /tmp/wake-authority/data/wake.sqlite3
            echo "source_format=legacy" >> "$GITHUB_ENV"
          else
            echo "wake-state contains neither supported authority database/archive" >&2
            exit 1
          fi
      - name: Reopen or migrate exact authority without provider access
        run: |
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          from wake.authority import open_authoritative_store

          data_dir = Path("/tmp/wake-authority/data")
          source_format = os.environ["source_format"]
          source_path = data_dir / ("sudofx.sqlite" if source_format == "sudofx" else "wake.sqlite3")
          source_bytes = source_path.stat().st_size

          started = time.monotonic()
          store = open_authoritative_store(data_dir)
          operation_seconds = time.monotonic() - started
          try:
              state = store.load()
              event_count = len(store.events())
              head = store.head()
              revision = store.kernel.context().revision
              health_before = store.record.health()

              # Rehearsal owns only this temporary copy. Compact it here to
              # measure recoverable SQLite slack before the live wake-state blob
              # crosses GitHub's 100 MiB single-file ceiling. Compaction must not
              # change WAKE meaning, application revision, or event history.
              compact_started = time.monotonic()
              store.record.compact()
              compact_seconds = time.monotonic() - compact_started
              health_after = store.record.health()
              assert store.load() == state
              assert store.head() == head
              assert len(store.events()) == event_count
              assert store.kernel.context().revision == revision
          finally:
              store.close()

          reopened = open_authoritative_store(data_dir)
          try:
              assert reopened.head() == head
              assert len(reopened.events()) == event_count
              assert reopened.load() == state
              assert reopened.kernel.context().revision == revision
          finally:
              reopened.close()

          sudofx_path = data_dir / "sudofx.sqlite"
          legacy_path = data_dir / "wake.sqlite3"
          assert sudofx_path.exists()
          assert not legacy_path.exists()

          sudofx_bytes = sudofx_path.stat().st_size
          checkpoint_bytes = int(os.environ.get("checkpoint_bytes", str(sudofx_bytes)))
          result = {
              "source_format": source_format,
              "source_bytes": source_bytes,
              "sudofx_bytes_before_compaction": health_before["database_bytes"],
              "sudofx_bytes_after_compaction": sudofx_bytes,
              "bytes_reclaimed": health_before["database_bytes"] - sudofx_bytes,
              "compact_seconds": round(compact_seconds, 3),
              "operation_seconds": round(operation_seconds, 3),
              "event_count": event_count,
              "accepted_revision": revision,
              "record_health_revision": health_after["revision"],
              "single_authority_database": True,
              "checkpoint_bytes": checkpoint_bytes,
              "github_100mb_safe": checkpoint_bytes < 100 * 1024 * 1024,
              "github_100mb_headroom": 100 * 1024 * 1024 - checkpoint_bytes,
          }
          print(json.dumps(result, sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("## Phase E authority rehearsal\n\n")
              for key, value in result.items():
                  out.write(f"- **{key}**: {value}\n")
          if not result["github_100mb_safe"]:
              raise SystemExit("authority checkpoint exceeds GitHub's 100 MiB safety ceiling")
          PY
