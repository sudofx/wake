name: WAKE — Source self-correction

on:
  workflow_run:
    workflows: ["WAKE✳︎ — Check code · automatic", "WAKE — Publish website", "WAKE — Research worker"]
    types: [completed]
  workflow_dispatch:
    inputs:
      request:
        description: Optional advanced repair request. Leave empty to check and correct automatically.
        type: string
        required: false
      model:
        description: Gemini model for this bounded request.
        type: string
        required: false
        default: gemini-3.5-flash-lite
      paths:
        description: One to four existing presentation/docs paths, separated by commas.
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: wake-source-self-correction
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref_name == 'master' && (github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'master' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      base: ${{ steps.check.outputs.base }}
      mode: ${{ steps.check.outputs.mode }}
      outcome: ${{ steps.check.outputs.outcome }}
      require_improvement: ${{ steps.check.outputs.require_improvement }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - id: check
        name: Diagnose source without model calls or research records
        env:
          GH_TOKEN: ${{ github.token }}
          CORRECTION_REQUEST: ${{ inputs.request }}
          CORRECTION_PATHS: ${{ inputs.paths }}
          CORRECTION_MODEL: ${{ inputs.model }}
        run: python scripts/automatic_self_correction.py inspect
      - uses: actions/upload-artifact@v4
        with:
          name: automatic-correction-check
          path: /tmp/wake-auto-correction/
          retention-days: 30
          if-no-files-found: error

  propose:
    needs: inspect
    if: needs.inspect.outputs.mode == 'model'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      base: ${{ needs.inspect.outputs.base }}
      outcome: ${{ steps.generate.outputs.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.inspect.outputs.base }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: automatic-correction-check
          path: /tmp/wake-auto-correction
      - id: generate
        name: Generate one bounded source proposal
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CORRECTION_REQUEST: ${{ inputs.request }}
          CORRECTION_PATHS: ${{ inputs.paths }}
          CORRECTION_MODEL: ${{ inputs.model }}
        run: python scripts/automatic_self_correction.py prepare
      - uses: actions/upload-artifact@v4
        with:
          name: source-correction-proposal
          path: /tmp/wake-auto-correction/proposal/
          retention-days: 30
          if-no-files-found: error

  test:
    needs: [inspect, propose]
    if: always() && needs.inspect.result == 'success' && (needs.inspect.outputs.mode == 'mechanical' || needs.propose.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Candidate execution receives no secrets and no write-capable token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.inspect.outputs.base }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        if: needs.inspect.outputs.mode == 'model'
        with:
          name: source-correction-proposal
          path: /tmp/wake-correction
      - uses: actions/download-artifact@v4
        if: needs.inspect.outputs.mode == 'mechanical'
        with:
          name: automatic-correction-check
          path: /tmp/wake-auto-correction
      - name: Build the test image from trusted source before applying candidate
        run: |
          cat > /tmp/wake-correction.Dockerfile <<'DOCKER'
          FROM python:3.13-bookworm
          COPY --from=node:22-bookworm-slim /usr/local/bin/node /usr/local/bin/node
          RUN node --version && git --version
          COPY pyproject.toml /build/pyproject.toml
          COPY wake /build/wake
          RUN python -m pip install --disable-pip-version-check '/build[hosted]'
          USER 65534:65534
          DOCKER
          docker build --file /tmp/wake-correction.Dockerfile --tag wake-correction-test .
      - name: Record the complete trusted baseline in the same restricted environment
        run: |
          cp example.research-topics.toml research-topics.toml
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 256 --memory 4g --cpus 2 \
            --tmpfs /tmp:rw,nosuid,nodev,exec,size=3g,mode=1777 \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --workdir /workspace --env PYTHONPATH=/workspace --env PYTHONDONTWRITEBYTECODE=1 \
            --env WAKE_DEV_RELOAD=false --env HOME=/tmp \
            --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0=/workspace \
            wake-correction-test python scripts/self_correction_checks.py record > /tmp/wake-baseline-tests.log
      - name: Apply validated candidate text
        if: needs.inspect.outputs.mode == 'model'
        run: python scripts/self_correction.py apply --plan /tmp/wake-correction/proposal.json
      - name: Apply only the recomputed trusted cache repair
        if: needs.inspect.outputs.mode == 'mechanical'
        run: python scripts/automatic_self_correction.py apply-mechanical
      - name: Check changed JavaScript syntax
        if: needs.inspect.outputs.mode == 'model'
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          plan = json.loads(Path('/tmp/wake-correction/proposal.json').read_text())
          for item in plan['changes']:
              if item['path'].endswith('.js'):
                  subprocess.run(['node', '--input-type=module', '--check'], input=Path(item['path']).read_bytes(), check=True)
          PY
      - name: Run candidate checks without credentials, network or writable host mounts
        run: |
          cp example.research-topics.toml research-topics.toml
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 256 --memory 4g --cpus 2 \
            --tmpfs /tmp:rw,nosuid,nodev,exec,size=3g,mode=1777 \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --workdir /workspace --env PYTHONPATH=/workspace --env PYTHONDONTWRITEBYTECODE=1 \
            --env WAKE_DEV_RELOAD=false --env HOME=/tmp \
            --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0=/workspace \
            wake-correction-test python scripts/self_correction_checks.py record > /tmp/wake-candidate-tests.log
      - name: Reject every regression against the trusted restricted baseline
        env:
          REQUIRE_IMPROVEMENT: ${{ needs.inspect.outputs.require_improvement }}
        run: python scripts/self_correction_checks.py compare --baseline /tmp/wake-baseline-tests.log --candidate /tmp/wake-candidate-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-correction-test-reports
          path: /tmp/wake-*-tests.log
          retention-days: 30
      - name: Preserve candidate diff for review
        if: always()
        run: git diff --no-ext-diff > /tmp/wake-correction.diff
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-correction-test-diff
          path: /tmp/wake-correction.diff
          retention-days: 30

  review:
    needs: [inspect, propose, test]
    if: always() && needs.propose.result == 'success' && needs.test.result == 'success' && needs.inspect.outputs.mode == 'model'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.propose.outputs.base }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: source-correction-proposal
          path: /tmp/wake-correction
      - name: Prepare review description
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/self_correction.py review-body --plan /tmp/wake-correction/proposal.json --output /tmp/wake-correction-review.md --run-url "$RUN_URL"
      - id: publish
        name: Open or recover the exact draft source change for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CORRECTION_BRANCH: wake-correction/${{ github.run_id }}
        run: |
          gh auth setup-git
          python scripts/self_correction.py publish --plan /tmp/wake-correction/proposal.json \
            --branch "$CORRECTION_BRANCH" --body-file /tmp/wake-correction-review.md


  repair:
    outputs:
      head: ${{ steps.apply.outputs.head }}
    needs: [inspect, test]
    if: always() && needs.inspect.outputs.mode == 'mechanical' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.inspect.outputs.base }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: automatic-correction-check
          path: /tmp/wake-auto-correction
      - name: Require full code checks for the exact source base
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/automatic_self_correction.py verify-base
      - id: apply
        name: Recompute trusted repair and advance source without forcing concurrent work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          python scripts/automatic_self_correction.py publish-mechanical

  request-check:
    needs: [inspect, repair]
    if: always() && (needs.repair.result == 'success' || (needs.inspect.result == 'success' && needs.inspect.outputs.mode == 'check_source'))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.repair.outputs.head || needs.inspect.outputs.base }}
          persist-credentials: false
      - name: Request independent CI for the applied source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run test.yml --ref master

  republish:
    needs: inspect
    if: needs.inspect.outputs.mode == 'republish'
    uses: ./.github/workflows/publish-pages.yml
    with:
      force: true
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write

  outcome:
    needs: [inspect, propose, test, review, repair, republish, request-check]
    if: always() && needs.inspect.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    name: "Outcome: ${{ needs.repair.result == 'success' && 'repaired' || needs.republish.result == 'success' && 'republished' || needs.review.result == 'success' && 'review_required' || needs.propose.outputs.outcome == 'provider_wait' && 'provider_wait' || needs.request-check.result == 'success' && 'delivery_wait' || (needs.inspect.result == 'success' && needs.inspect.outputs.mode == 'none' && needs.inspect.outputs.outcome) || 'failed' }}"
    steps:
      - name: Record the actual outcome
        env:
          DIAGNOSIS: ${{ needs.inspect.outputs.outcome }}
          MODE: ${{ needs.inspect.outputs.mode }}
          REPAIR: ${{ needs.repair.result }}
          REPUBLISH: ${{ needs.republish.result }}
          REVIEW: ${{ needs.review.result }}
          PROVIDER: ${{ needs.propose.outputs.outcome }}
          DELIVERY: ${{ needs.request-check.result }}
        run: |
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          record = {key.lower(): os.environ[key] for key in ('DIAGNOSIS', 'MODE', 'REPAIR', 'REPUBLISH', 'REVIEW', 'PROVIDER', 'DELIVERY')}
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('Automatic correction outcome\n\n```json\n' + json.dumps(record, indent=2) + '\n```\nNo native research record was changed. A repaired source still needs independent CI and website delivery.\n')
          PYTHON
