name: WAKE✳︎ - Restart
run-name: "Restart WAKE✳︎ with latest verified code"

# ELI5: One safe maintenance button: stop research, verify master, make it live, then start research again.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: wake-operator-control
  cancel-in-progress: false

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Pin the exact master candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')"
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "Restart candidate: $candidate_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Require hosted research topics in the release candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$GITHUB_REPOSITORY/contents/research-topics.toml?ref=$CANDIDATE_SHA" >/dev/null 2>&1; then
            echo "::error::Hosted release is missing research-topics.toml. Run 'cp example.research-topics.toml research-topics.toml', edit it, then 'git add -f research-topics.toml', commit and push before promoting."
            exit 1
          fi
          echo "Hosted topic configuration is present in the pinned release." >> "$GITHUB_STEP_SUMMARY"

      - name: Refuse a known-failing automatic CI result
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          result="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs?head_sha=$CANDIDATE_SHA&event=push&per_page=20" \
            --jq '[.workflow_runs[] | select(.head_sha==env.CANDIDATE_SHA)] | sort_by(.created_at) | reverse | .[0] // {}')"
          status="$(jq -r '.status // "missing"' <<<"$result")"
          conclusion="$(jq -r '.conclusion // ""' <<<"$result")"
          if [[ "$status" == "completed" && "$conclusion" == "failure" ]]; then
            run_id="$(jq -r '.id // empty' <<<"$result")"
            hard_failures="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
              --jq '[.jobs[] | select(.conclusion=="failure" or .conclusion=="timed_out" or .conclusion=="action_required" or .conclusion=="startup_failure")] | length')"
            if [[ "$hard_failures" != "0" ]]; then
              echo "::error::Automatic CI has $hard_failures real failed job(s) for $CANDIDATE_SHA."
              exit 1
            fi
            echo "Automatic CI is marked failure, but no job actually failed (for example, jobs were cancelled). Treating it as inconclusive; Restart will verify the pinned candidate itself." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$status" == "completed" && "$conclusion" == "success" ]]; then
            echo "Automatic CI already passed for $CANDIDATE_SHA." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$status" == "completed" ]]; then
            echo "Automatic CI completed without a definitive pass/fail signal (conclusion: $conclusion). Restart will verify the pinned candidate in this job before promotion." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Automatic CI is $status; Restart will not wait on another runner. The pinned candidate will be verified in this job before promotion." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Close continuation latch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/wake-runner.yml" --jq '.state')"
          if [[ "$state" == "active" ]]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/wake-runner.yml/disable" >/dev/null
          fi
          echo "Continuation latch closed (previous state: $state)." >> "$GITHUB_STEP_SUMMARY"

      - name: Drain active research cycles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          empty_checks=0
          for attempt in {1..60}; do
          runtime_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/wake-runtime" --jq '.object.sha')"
          now_epoch="$(date -u +%s)"
          mapfile -t candidates < <(
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/wake.yml/runs?branch=wake-runtime&per_page=50" \
              --jq ".workflow_runs[] | select(.head_branch==\"wake-runtime\" and .head_sha==\"$runtime_sha\" and .status!=\"completed\") | [.id,.created_at,.status] | @tsv"
          )
          real_runs=()
          for row in "${candidates[@]}"; do
            IFS=$'\t' read -r run_id created_at run_status <<<"$row"
            job_count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=1" --jq '.total_count' 2>/dev/null || echo 1)"
            created_epoch="$(date -u -d "$created_at" +%s)"
            age_seconds=$((now_epoch - created_epoch))
            if [[ "$run_status" == "queued" && "$job_count" == "0" && "$age_seconds" -ge 120 ]]; then
              echo "Ignoring stale queued zero-job WAKE run $run_id; it is not active research." >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            real_runs+=("$run_id")
          done
            if (( ${#real_runs[@]} == 0 )); then
              empty_checks=$((empty_checks + 1))
              if (( empty_checks >= 2 )); then
                echo "Research is fully stopped." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            else
              empty_checks=0
              for run_id in "${real_runs[@]}"; do
                gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null || true
              done
              if [[ "$attempt" == "10" ]]; then
                echo "Normal cancellation did not retire ${#real_runs[@]} real run(s); force-cancelling current-runtime work." >> "$GITHUB_STEP_SUMMARY"
                for run_id in "${real_runs[@]}"; do
                  gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/force-cancel" >/dev/null || true
                done
              fi
            fi
            sleep 2
          done
          echo "::error::Research did not fully drain even after ignoring stale zero-job ghosts and force-cancelling real work."
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify exact candidate before promotion
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e .
          python -m unittest discover -s tests -v
          rm -rf /tmp/wake-restart /tmp/wake-restart-site
          python -m wake --data /tmp/wake-restart experiment --cycles 100 --output /tmp/wake-restart-site
          python -m wake audit --events /tmp/wake-restart-site/events.jsonl --head /tmp/wake-restart-site/head.txt

      - name: Promote exact verified candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          runtime_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/wake-runtime" --jq '.object.sha')"
          now_epoch="$(date -u +%s)"
          mapfile -t candidates < <(
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/wake.yml/runs?branch=wake-runtime&per_page=50" \
              --jq ".workflow_runs[] | select(.head_branch==\"wake-runtime\" and .head_sha==\"$runtime_sha\" and .status!=\"completed\") | [.id,.created_at,.status] | @tsv"
          )
          real_runs=()
          for row in "${candidates[@]}"; do
            IFS=$'\t' read -r run_id created_at run_status <<<"$row"
            job_count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=1" --jq '.total_count' 2>/dev/null || echo 1)"
            created_epoch="$(date -u -d "$created_at" +%s)"
            age_seconds=$((now_epoch - created_epoch))
            if [[ "$run_status" == "queued" && "$job_count" == "0" && "$age_seconds" -ge 120 ]]; then
              echo "Ignoring stale queued zero-job WAKE run $run_id; it is not active research." >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            real_runs+=("$run_id")
          done
          [[ "${#real_runs[@]}" == "0" ]] || { echo "::error::wake-runtime became active during verification."; exit 1; }
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/wake-runtime" \
            -f sha="$CANDIDATE_SHA" -F force=true >/dev/null
          promoted="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/wake-runtime" --jq '.object.sha')"
          [[ "$promoted" == "$CANDIDATE_SHA" ]] || { echo "::error::Promotion verification failed."; exit 1; }
          echo "Promoted wake-runtime to $promoted." >> "$GITHUB_STEP_SUMMARY"

      - name: Reopen continuation latch and start research
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/wake-runner.yml/enable" >/dev/null
          gh workflow run wake.yml --repo "$GITHUB_REPOSITORY" --ref wake-runtime             -f "dispatch_token=restart-$GITHUB_RUN_ID"             -f "runtime_ref=$CANDIDATE_SHA"
          echo "Continuation latch reopened and first cycle dispatched." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify restarted cycle appears
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/wake.yml/runs?branch=wake-runtime&per_page=20"               --jq '[.workflow_runs[] | select(.head_sha==env.CANDIDATE_SHA and .status!="completed")] | sort_by(.created_at) | reverse | .[0] // {}')"
            run_id="$(jq -r '.id // empty' <<<"$run")"
            if [[ -n "$run_id" ]]; then
              echo "Restart verified: WAKE✳︎ cycle $run_id is queued or running on $CANDIDATE_SHA." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Promotion succeeded, but no restarted WAKE✳︎ cycle appeared. Continuation latch remains open; inspect Actions before retrying."
          exit 1

      - name: Recover research if restart fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/wake-runner.yml/enable" >/dev/null || true
          runtime_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/wake-runtime" --jq '.object.sha')"
          active_count="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/wake.yml/runs?branch=wake-runtime&per_page=50" \
            --jq "[.workflow_runs[] | select(.head_sha==\"$runtime_sha\" and .status!=\"completed\")] | length")"
          if [[ "$active_count" == "0" ]]; then
            gh workflow run wake.yml --repo "$GITHUB_REPOSITORY" --ref wake-runtime \
              -f "dispatch_token=recover-$GITHUB_RUN_ID" \
              -f "runtime_ref=$runtime_sha" || true
            echo "Restart failed; continuation latch reopened and current promoted runtime $runtime_sha was relaunched." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Restart failed; continuation latch reopened. Current promoted runtime already has $active_count active run(s)." >> "$GITHUB_STEP_SUMMARY"
          fi
