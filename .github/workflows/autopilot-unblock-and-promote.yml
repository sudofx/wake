name: "WAKE✳︎ — Emergency unblock and promote"

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/autopilot-unblock-and-promote.yml'

permissions:
  actions: write
  contents: write

concurrency:
  group: wake-emergency-recovery-20261002
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Pin exact candidate
        run: |
          set -euo pipefail
          echo "candidate=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Retire stale maintenance runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t runs < <(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" --jq '
              .workflow_runs[]
              | select(.status != "completed")
              | select(
                  .path == ".github/workflows/operator-restart.yml"
                  or .path == ".github/workflows/autopilot-controlled-restart.yml"
                  or .path == ".github/workflows/autopilot-restart-once.yml"
                  or .path == ".github/workflows/promote-runtime.yml"
                )
              | .id'
          )
          for run_id in "${runs[@]}"; do
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null 2>&1 || true
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/force-cancel" >/dev/null 2>&1 || true
          done
          for attempt in {1..30}; do
            remaining=0
            for run_id in "${runs[@]}"; do
              status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status' 2>/dev/null || echo completed)"
              [[ "$status" == "completed" ]] || remaining=$((remaining + 1))
            done
            (( remaining == 0 )) && exit 0
            sleep 2
          done
          echo "::error::A stale maintenance run would not retire."
          exit 1

      - name: Close continuation latch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/wake-runner.yml" --jq '.state')"
          if [[ "$state" == "active" ]]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/wake-runner.yml/disable" >/dev/null
          fi

      - name: Drain real research
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runtime_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/wake-runtime" --jq '.object.sha')"
          empty_checks=0
          for attempt in {1..60}; do
            now_epoch="$(date -u +%s)"
            mapfile -t candidates < <(
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/wake.yml/runs?branch=wake-runtime&per_page=50" \
                --jq ".workflow_runs[]
                  | select(.head_branch==\"wake-runtime\" and .head_sha==\"$runtime_sha\" and .status!=\"completed\")
                  | [.id,.created_at,.status] | @tsv"
            )
            real_runs=()
            for row in "${candidates[@]}"; do
              IFS=$'\t' read -r run_id created_at run_status <<<"$row"
              job_count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=1" --jq '.total_count' 2>/dev/null || echo 1)"
              created_epoch="$(date -u -d "$created_at" +%s)"
              age_seconds=$((now_epoch - created_epoch))
              if [[ "$run_status" == "queued" && "$job_count" == "0" && "$age_seconds" -ge 120 ]]; then
                echo "Ignoring stale queued zero-job WAKE run $run_id." >> "$GITHUB_STEP_SUMMARY"
                continue
              fi
              real_runs+=("$run_id")
            done

            if (( ${#real_runs[@]} == 0 )); then
              empty_checks=$((empty_checks + 1))
              if (( empty_checks >= 2 )); then
                echo "Research drain confirmed." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            else
              empty_checks=0
              for run_id in "${real_runs[@]}"; do
                gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null 2>&1 || true
                gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/force-cancel" >/dev/null 2>&1 || true
              done
            fi
            sleep 2
          done
          echo "::error::Real WAKE research did not drain."
          exit 1

      - name: Require successful automatic CI for exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            result="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs?head_sha=$CANDIDATE_SHA&event=push&per_page=20" \
              --jq '[.workflow_runs[] | select(.head_sha==env.CANDIDATE_SHA)] | sort_by(.created_at) | reverse | .[0] // {}')"
            status="$(jq -r '.status // "missing"' <<<"$result")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$result")"
            if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then
              echo "Automatic CI passed for $CANDIDATE_SHA." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ "$status" == "completed" && "$conclusion" != "success" ]]; then
              echo "::error::Automatic CI failed for $CANDIDATE_SHA (conclusion: $conclusion)."
              exit 1
            fi
            sleep 5
          done
          echo "::error::Automatic CI did not finish successfully for $CANDIDATE_SHA."
          exit 1

      - name: Confirm no real research resumed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runtime_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/wake-runtime" --jq '.object.sha')"
          now_epoch="$(date -u +%s)"
          active=0
          mapfile -t candidates < <(
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/wake.yml/runs?branch=wake-runtime&per_page=50" \
              --jq ".workflow_runs[]
                | select(.head_branch==\"wake-runtime\" and .head_sha==\"$runtime_sha\" and .status!=\"completed\")
                | [.id,.created_at,.status] | @tsv"
          )
          for row in "${candidates[@]}"; do
            IFS=$'\t' read -r run_id created_at run_status <<<"$row"
            job_count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=1" --jq '.total_count' 2>/dev/null || echo 1)"
            created_epoch="$(date -u -d "$created_at" +%s)"
            age_seconds=$((now_epoch - created_epoch))
            if [[ "$run_status" == "queued" && "$job_count" == "0" && "$age_seconds" -ge 120 ]]; then
              continue
            fi
            active=$((active + 1))
          done
          [[ "$active" == "0" ]] || { echo "::error::Real wake-runtime work resumed during recovery."; exit 1; }

      - name: Promote exact verified candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/wake-runtime" \
            -f sha="$CANDIDATE_SHA" -F force=true >/dev/null
          promoted="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/wake-runtime" --jq '.object.sha')"
          [[ "$promoted" == "$CANDIDATE_SHA" ]] || { echo "::error::Promotion verification failed."; exit 1; }
          echo "Promoted wake-runtime to $promoted." >> "$GITHUB_STEP_SUMMARY"

      - name: Reopen latch and dispatch fresh research
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/wake-runner.yml/enable" >/dev/null
          gh workflow run wake.yml --repo "$GITHUB_REPOSITORY" --ref wake-runtime \
            -f "dispatch_token=emergency-$GITHUB_RUN_ID" \
            -f "runtime_ref=$CANDIDATE_SHA"

      - name: Verify fresh cycle exists
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/wake.yml/runs?branch=wake-runtime&per_page=20" \
              --jq '[.workflow_runs[] | select(.head_sha==env.CANDIDATE_SHA and .status!="completed")] | sort_by(.created_at) | reverse | .[0].id // empty')"
            if [[ -n "$run_id" ]]; then
              echo "Fresh WAKE cycle $run_id is queued or running on $CANDIDATE_SHA." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 2
          done
          echo "::error::No fresh WAKE cycle appeared after promotion."
          exit 1
