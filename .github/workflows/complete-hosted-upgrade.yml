name: WAKE — Complete requested hosted upgrade
on:
  push:
    branches: [master]
    paths: ['hosted-runtime.json', '.github/workflows/complete-hosted-upgrade.yml']
  workflow_run:
    workflows: [WAKE — Verify hosted runtime upgrade, 'WAKE✳︎ — Check code · automatic']
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '23,53 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: wake-upgrade-completion
  cancel-in-progress: false
jobs:
  complete:
    if: github.ref_name == 'master' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'schedule' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve the exact approved audit once both dependencies are ready
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_WORKFLOW: ${{ github.event.workflow_run.name }}
          EVENT_RUN: ${{ github.event.workflow_run.id }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          policy=$(gh api "repos/$GITHUB_REPOSITORY/contents/hosted-runtime.json?ref=master" --jq .content | base64 -d)
          intent=$(jq -c --arg repo "$GITHUB_REPOSITORY" '.installations[$repo].pending_upgrade // empty' <<< "$policy")
          if [ -z "$intent" ]; then exit 0; fi
          run_id=$(jq -er '.verification_run | select(type == "number" and . > 0 and floor == .)' <<< "$intent")
          if [ "$EVENT_NAME" = workflow_run ]; then
            if [ "$EVENT_WORKFLOW" = 'WAKE — Verify hosted runtime upgrade' ]; then
              if [ "$EVENT_RUN" != "$run_id" ]; then exit 0; fi
            elif ! jq -e --arg sha "$EVENT_SHA" '.candidate == $sha or .presentation_revision == $sha' <<< "$intent" >/dev/null; then
              exit 0
            fi
          fi
          result=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status + "/" + (.conclusion // "")')
          if [ "$result" = completed/success ]; then
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.ready.outputs.run_id != ''
      - uses: actions/setup-python@v7
        if: steps.ready.outputs.run_id != ''
        with:
          python-version: '3.13'
      - if: steps.ready.outputs.run_id != ''
        run: python -m pip install --disable-pip-version-check -e '.[hosted]'
      - uses: actions/download-artifact@v6
        if: steps.ready.outputs.run_id != ''
        with:
          name: upgrade-verification
          path: verification
          run-id: ${{ steps.ready.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Recheck exact proof, promote the requested binding, and request continuation
        if: steps.ready.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFICATION_RUN: ${{ steps.ready.outputs.run_id }}
        run: python scripts/complete_hosted_upgrade.py --run-id "$VERIFICATION_RUN" --report verification/upgrade-verification.json
