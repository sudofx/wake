name: WAKE — Complete requested hosted upgrade
on:
  workflow_run:
    workflows: [WAKE — Verify hosted runtime upgrade, 'WAKE✳︎ — Check code · automatic']
    types: [completed]
  workflow_dispatch:
    inputs:
      verification_run:
        description: Successful verifier run matching the explicit pending upgrade.
        type: string
        required: true
permissions:
  contents: write
  actions: write
concurrency:
  group: wake-upgrade-completion
  cancel-in-progress: false
jobs:
  complete:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check -e '.[hosted]'
      - name: Resolve the exact approved audit once both dependencies are ready
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_WORKFLOW: ${{ github.event.workflow_run.name }}
          EVENT_RUN: ${{ github.event.workflow_run.id }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_RUN: ${{ inputs.verification_run }}
        run: |
          python - <<'PY'
          import os
          from scripts.complete_hosted_upgrade import read_policy
          from wake.hosted import GitHub
          client = GitHub(os.environ['GITHUB_REPOSITORY'], os.environ['GH_TOKEN'])
          if os.environ['EVENT_NAME'] == 'workflow_dispatch':
              run_id = int(os.environ['MANUAL_RUN'])
          elif os.environ['EVENT_WORKFLOW'] == 'WAKE — Verify hosted runtime upgrade':
              run_id = int(os.environ['EVENT_RUN'])
          else:
              policy, _ = read_policy(client)
              intent = policy['installations'][client.repository].get('pending_upgrade')
              run_id = int(intent['verification_run']) if intent and os.environ['EVENT_SHA'] in (
                  intent['candidate'], intent.get('presentation_revision')) else 0
          if run_id:
              audit = client.request('actions/runs/' + str(run_id))
              if audit['status'] != 'completed' or audit['conclusion'] != 'success':
                  run_id = 0
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('run_id=' + (str(run_id) if run_id else '') + '\n')
          PY
      - uses: actions/download-artifact@v6
        if: steps.ready.outputs.run_id != ''
        with:
          name: upgrade-verification
          path: verification
          run-id: ${{ steps.ready.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Recheck exact proof, promote the requested binding, and request continuation
        if: steps.ready.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFICATION_RUN: ${{ steps.ready.outputs.run_id }}
        run: python scripts/complete_hosted_upgrade.py --run-id "$VERIFICATION_RUN" --report verification/upgrade-verification.json
