name: WAKE✳︎ — RUN 100-CYCLE SIMULATION CHECK

# Final verification lane: changing this workflow deliberately reruns the
# full synthetic experiment on the exact current implementation commit.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-experiment.yml'

permissions:
  contents: read

concurrency:
  group: wake-100-cycle-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install WAKE runtime dependencies
        run: python -m pip install --disable-pip-version-check -e .
      - name: Simulate 100 WAKE cycles
        run: python -m wake --data /tmp/wake-experiment experiment --cycles 100 --output site
      - name: Verify the simulated durable record
        run: python -m wake audit --events site/events.jsonl --head site/head.txt
      - name: Upload verified journal
        uses: actions/upload-artifact@v4
        with:
          name: verified-journal
          path: site/
