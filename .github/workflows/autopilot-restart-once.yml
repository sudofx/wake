name: WAKE✳︎ — Autopilot one-shot restart
# armed-recovery: duplicate-project-loop-20261002
# retrigger: ghost-aware-controls-contract
# retrigger: stable-stop-contract

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/autopilot-restart-once.yml'

permissions:
  actions: write
  contents: write

concurrency:
  group: wake-operator-control
  cancel-in-progress: false

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pin exact candidate
        id: candidate
        run: |
          set -euo pipefail
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "Autopilot restart candidate: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Close continuation latch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/wake-runner.yml" --jq '.state')"
          if [[ "$state" == "active" ]]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/wake-runner.yml/disable" >/dev/null
          fi
          echo "Continuation latch closed (previous state: $state)." >> "$GITHUB_STEP_SUMMARY"

      - name: Drain active research
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runtime_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/wake-runtime" --jq '.object.sha')"
          empty_checks=0
          for attempt in {1..60}; do
            now_epoch="$(date -u +%s)"
            mapfile -t candidates < <(
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/wake.yml/runs?branch=wake-runtime&per_page=50" \
                --jq ".workflow_runs[] | select(.head_branch==\"wake-runtime\" and .head_sha==\"$runtime_sha\" and .status!=\"completed\") | [.id,.created_at,.status] | @tsv"
            )
            real_runs=()
            for row in "${candidates[@]}"; do
              IFS=$'\t' read -r run_id created_at run_status <<<"$row"
              job_count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=1" --jq '.total_count' 2>/dev/null || echo 1)"
              created_epoch="$(date -u -d "$created_at" +%s)"
              age_seconds=$((now_epoch - created_epoch))
              if [[ "$run_status" == "queued" && "$job_count" == "0" && "$age_seconds" -ge 120 ]]; then
                echo "Ignoring stale queued zero-job WAKE run $run_id; it is not active research." >> "$GITHUB_STEP_SUMMARY"
                continue
              fi
              real_runs+=("$run_id")
            done
            if (( ${#real_runs[@]} == 0 )); then
              empty_checks=$((empty_checks + 1))
              if (( empty_checks >= 2 )); then
                echo "Research is fully stopped." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            else
              empty_checks=0
              for run_id in "${real_runs[@]}"; do
                gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null 2>&1 || true
                gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/force-cancel" >/dev/null 2>&1 || true
              done
            fi
            sleep 2
          done
          echo "::error::Real WAKE research did not fully drain before timeout."
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify exact candidate
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e .
          python -m unittest discover -s tests -v
          rm -rf /tmp/wake-autopilot /tmp/wake-autopilot-site
          python -m wake --data /tmp/wake-autopilot experiment --cycles 100 --output /tmp/wake-autopilot-site
          python -m wake audit --events /tmp/wake-autopilot-site/events.jsonl --head /tmp/wake-autopilot-site/head.txt

      - name: Promote exact verified candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          runtime_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/wake-runtime" --jq '.object.sha')"
          now_epoch="$(date -u +%s)"
          mapfile -t candidates < <(
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/wake.yml/runs?branch=wake-runtime&per_page=50" \
              --jq ".workflow_runs[] | select(.head_branch==\"wake-runtime\" and .head_sha==\"$runtime_sha\" and .status!=\"completed\") | [.id,.created_at,.status] | @tsv"
          )
          real_runs=()
          for row in "${candidates[@]}"; do
            IFS=$'\t' read -r run_id created_at run_status <<<"$row"
            job_count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=1" --jq '.total_count' 2>/dev/null || echo 1)"
            created_epoch="$(date -u -d "$created_at" +%s)"
            age_seconds=$((now_epoch - created_epoch))
            if [[ "$run_status" == "queued" && "$job_count" == "0" && "$age_seconds" -ge 120 ]]; then
              continue
            fi
            real_runs+=("$run_id")
          done
          [[ "${#real_runs[@]}" == "0" ]] || { echo "::error::wake-runtime became active during verification."; exit 1; }
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/wake-runtime"             -f sha="$CANDIDATE_SHA" -F force=false >/dev/null
          promoted="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/wake-runtime" --jq '.object.sha')"
          [[ "$promoted" == "$CANDIDATE_SHA" ]] || { echo "::error::Promotion verification failed."; exit 1; }
          echo "Promoted wake-runtime to $promoted." >> "$GITHUB_STEP_SUMMARY"

      - name: Reopen continuation latch and start research
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/wake-runner.yml/enable" >/dev/null
          gh workflow run wake.yml --repo "$GITHUB_REPOSITORY" --ref wake-runtime             -f "dispatch_token=autopilot-$GITHUB_RUN_ID"             -f "runtime_ref=$CANDIDATE_SHA"
          echo "Continuation latch reopened and first cycle dispatched." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify restarted cycle appears
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/wake.yml/runs?branch=wake-runtime&per_page=20"               --jq '[.workflow_runs[] | select(.head_sha==env.CANDIDATE_SHA and .status!="completed")] | sort_by(.created_at) | reverse | .[0] // {}')"
            run_id="$(jq -r '.id // empty' <<<"$run")"
            if [[ -n "$run_id" ]]; then
              echo "Restart verified: WAKE✳︎ cycle $run_id is queued or running on $CANDIDATE_SHA." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Promotion succeeded, but no restarted WAKE✳︎ cycle appeared."
          exit 1
