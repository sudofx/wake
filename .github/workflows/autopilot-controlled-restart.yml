name: WAKE✳︎ — Autopilot controlled restart

on:
  push:
    branches: [master]
    paths:
      - '.github/autopilot-restart-trigger.txt'

permissions:
  actions: write
  contents: write

concurrency:
  group: wake-operator-control
  cancel-in-progress: false

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Record maintenance start
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          write_status() {
            local phase="$1" result="$2"
            local body encoded sha
            body="$(jq -nc --arg candidate "$CANDIDATE_SHA" --arg phase "$phase" --arg result "$result" --arg run "$GITHUB_RUN_ID"               '{candidate:$candidate,phase:$phase,result:$result,run_id:$run,updated_at:(now|todateiso8601)}')"
            encoded="$(printf '%s' "$body" | base64 -w0)"
            sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/autopilot-restart-status.json?ref=autopilot-status" --jq '.sha' 2>/dev/null || true)"
            if [[ -n "$sha" ]]; then
              gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/autopilot-restart-status.json"                 -f message="Update WAKE autopilot restart status" -f content="$encoded"                 -f branch="autopilot-status" -f sha="$sha" >/dev/null
            else
              gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/autopilot-restart-status.json"                 -f message="Initialize WAKE autopilot restart status" -f content="$encoded"                 -f branch="autopilot-status" >/dev/null
            fi
          }
          write_status "starting" "running"
          echo "AUTOPILOT_PHASE=starting" >> "$GITHUB_ENV"
          echo "Autopilot candidate: $CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Close continuation latch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/wake-runner.yml" --jq '.state')"
          if [[ "$state" == "active" ]]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/wake-runner.yml/disable" >/dev/null
          fi
          echo "AUTOPILOT_PHASE=latch-closed" >> "$GITHUB_ENV"
          echo "Continuation latch closed (previous state: $state)." >> "$GITHUB_STEP_SUMMARY"

      - name: Drain active research
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runtime_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/wake-runtime" --jq '.object.sha')"
          empty_checks=0
          for attempt in {1..60}; do
            now_epoch="$(date -u +%s)"
            mapfile -t candidates < <(
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/wake.yml/runs?branch=wake-runtime&per_page=50" \
                --jq ".workflow_runs[] | select(.head_branch==\"wake-runtime\" and .head_sha==\"$runtime_sha\" and .status!=\"completed\") | [.id,.created_at,.status] | @tsv"
            )
            real_runs=()
            for row in "${candidates[@]}"; do
              IFS=$'\t' read -r run_id created_at run_status <<<"$row"
              job_count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=1" --jq '.total_count' 2>/dev/null || echo 1)"
              created_epoch="$(date -u -d "$created_at" +%s)"
              age_seconds=$((now_epoch - created_epoch))
              if [[ "$run_status" == "queued" && "$job_count" == "0" && "$age_seconds" -ge 120 ]]; then
                echo "Ignoring stale queued zero-job WAKE run $run_id; it is not active research." >> "$GITHUB_STEP_SUMMARY"
                continue
              fi
              real_runs+=("$run_id")
            done
            if (( ${#real_runs[@]} == 0 )); then
              empty_checks=$((empty_checks + 1))
              if (( empty_checks >= 2 )); then
                echo "AUTOPILOT_PHASE=drained" >> "$GITHUB_ENV"
                echo "Research fully stopped." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            else
              empty_checks=0
              for run_id in "${real_runs[@]}"; do
                gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null 2>&1 || true
                gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/force-cancel" >/dev/null 2>&1 || true
              done
            fi
            sleep 2
          done
          echo "::error::Real WAKE research did not fully drain before timeout."
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify exact candidate
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e .
          python -m unittest discover -s tests -v
          rm -rf /tmp/wake-autopilot /tmp/wake-autopilot-site
          python -m wake --data /tmp/wake-autopilot experiment --cycles 100 --output /tmp/wake-autopilot-site
          python -m wake audit --events /tmp/wake-autopilot-site/events.jsonl --head /tmp/wake-autopilot-site/head.txt
          echo "AUTOPILOT_PHASE=verified" >> "$GITHUB_ENV"

      - name: Promote exact verified candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          runtime_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/wake-runtime" --jq '.object.sha')"
          now_epoch="$(date -u +%s)"
          mapfile -t candidates < <(
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/wake.yml/runs?branch=wake-runtime&per_page=50" \
              --jq ".workflow_runs[] | select(.head_branch==\"wake-runtime\" and .head_sha==\"$runtime_sha\" and .status!=\"completed\") | [.id,.created_at,.status] | @tsv"
          )
          real_runs=()
          for row in "${candidates[@]}"; do
            IFS=$'\t' read -r run_id created_at run_status <<<"$row"
            job_count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=1" --jq '.total_count' 2>/dev/null || echo 1)"
            created_epoch="$(date -u -d "$created_at" +%s)"
            age_seconds=$((now_epoch - created_epoch))
            if [[ "$run_status" == "queued" && "$job_count" == "0" && "$age_seconds" -ge 120 ]]; then
              continue
            fi
            real_runs+=("$run_id")
          done
          [[ "${#real_runs[@]}" == "0" ]] || { echo "::error::wake-runtime became active during verification."; exit 1; }
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/wake-runtime"             -f sha="$CANDIDATE_SHA" -F force=true >/dev/null
          promoted="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/wake-runtime" --jq '.object.sha')"
          [[ "$promoted" == "$CANDIDATE_SHA" ]] || { echo "::error::Promotion verification failed."; exit 1; }
          echo "AUTOPILOT_PHASE=promoted" >> "$GITHUB_ENV"
          echo "Promoted wake-runtime to $promoted." >> "$GITHUB_STEP_SUMMARY"

      - name: Reopen continuation latch and start research
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/wake-runner.yml/enable" >/dev/null
          gh workflow run wake.yml --repo "$GITHUB_REPOSITORY" --ref wake-runtime             -f "dispatch_token=autopilot-$GITHUB_RUN_ID"             -f "runtime_ref=$CANDIDATE_SHA"
          echo "AUTOPILOT_PHASE=dispatched" >> "$GITHUB_ENV"

      - name: Verify restarted cycle appears
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/wake.yml/runs?branch=wake-runtime&per_page=20"               --jq '[.workflow_runs[] | select(.head_sha==env.CANDIDATE_SHA and .status!="completed")] | sort_by(.created_at) | reverse | .[0] // {}')"
            run_id="$(jq -r '.id // empty' <<<"$run")"
            if [[ -n "$run_id" ]]; then
              echo "AUTOPILOT_PHASE=restarted" >> "$GITHUB_ENV"
              echo "Restart verified: WAKE✳︎ cycle $run_id is queued or running on $CANDIDATE_SHA." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Promotion succeeded, but no restarted WAKE✳︎ cycle appeared."
          exit 1

      - name: Record final maintenance status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.sha }}
          JOB_RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          phase="${AUTOPILOT_PHASE:-unknown}"
          body="$(jq -nc --arg candidate "$CANDIDATE_SHA" --arg phase "$phase" --arg result "$JOB_RESULT" --arg run "$GITHUB_RUN_ID"             '{candidate:$candidate,phase:$phase,result:$result,run_id:$run,updated_at:(now|todateiso8601)}')"
          encoded="$(printf '%s' "$body" | base64 -w0)"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/autopilot-restart-status.json?ref=autopilot-status" --jq '.sha' 2>/dev/null || true)"
          if [[ -n "$sha" ]]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/autopilot-restart-status.json"               -f message="Finalize WAKE autopilot restart status" -f content="$encoded"               -f branch="autopilot-status" -f sha="$sha" >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/autopilot-restart-status.json"               -f message="Finalize WAKE autopilot restart status" -f content="$encoded"               -f branch="autopilot-status" >/dev/null
          fi
