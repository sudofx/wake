# WAKE✳︎ MAINTAINER NOTE
# Cloud execution separates read-only publication from authoritative state mutation.
# Publication may run independently; research/reset remains one serialized writer.

name: WAKE✳︎ — research & journal
run-name: "WAKE✳︎ ${{ inputs.dispatch_token || github.event_name }}"

on:
  push:
    branches: [master]
    paths: ['wake/**', 'scripts/github_wake.py', 'wake.toml', 'research-topics.toml', '.github/workflows/wake.yml']
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      publish_only:
        description: Refresh the website without calling Gemini
        type: boolean
        default: false
      reset:
        description: Irreversibly reset durable research/history to WAKE 0 and republish
        type: boolean
        default: false
      dispatch_token:
        description: Correlation token used by multi-operator batch dispatchers
        type: string
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publication:
    # Code pushes and explicit publish-only dispatches are read-only consumers of
    # wake-state. Newer refreshes replace older ones instead of queueing behind Gemini.
    if: github.event_name == 'push' || inputs.publish_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: wake-publication
      cancel-in-progress: true
    outputs:
      report_ready: ${{ steps.report.outputs.ready }}
      artifact_name: ${{ steps.report.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render current durable record
        id: cycle
        run: python scripts/github_wake.py --publish-only
      - name: Confirm report is ready
        id: report
        run: |
          test -f site/index.html
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo 'artifact_name=github-pages-${{ github.run_id }}-${{ github.run_attempt }}' >> "$GITHUB_OUTPUT"
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Save the phone journal
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: ${{ steps.report.outputs.artifact_name }}
      - name: Record run summary
        if: always()
        run: |
          if test -f site/operation.json; then
            cat site/operation.json >> "$GITHUB_STEP_SUMMARY"
          fi

  wake:
    # Only this lane may mutate the durable record. Keeping one writer preserves
    # append-only ordering while publication no longer consumes this queue.
    if: github.ref_name == github.event.repository.default_branch && github.event_name != 'push' && inputs.publish_only != true && (github.event_name != 'schedule' || vars.WAKE_SCHEDULE_PAUSED != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: wake-durable-state
      cancel-in-progress: false
      queue: max
    outputs:
      report_ready: ${{ steps.report.outputs.ready }}
      artifact_name: ${{ steps.report.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Continue independent research
        id: cycle
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [[ "${{ inputs.reset }}" == "true" ]]; then
            python scripts/github_wake.py --reset --confirm-reset
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            python scripts/github_wake.py --scheduled
          else
            python scripts/github_wake.py --record-only
          fi
      - name: Confirm report is ready
        id: report
        if: always() && steps.cycle.outputs.skipped != 'true' && steps.cycle.outputs.publication_skipped != 'true'
        run: |
          test -f site/index.html
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo 'artifact_name=github-pages-${{ github.run_id }}-${{ github.run_attempt }}' >> "$GITHUB_OUTPUT"
      - name: Configure Pages
        if: always() && steps.report.outcome == 'success'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Save the phone journal
        if: always() && steps.report.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: ${{ steps.report.outputs.artifact_name }}
      - name: Record run summary
        if: always()
        run: |
          if test -f site/operation.json; then
            cat site/operation.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Fail only when operator attention is required
        if: always() && steps.cycle.outcome == 'failure'
        run: exit 1

  publish-refresh:
    needs: publication
    if: needs.publication.outputs.report_ready == 'true' && !cancelled()
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish latest journal
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.publication.outputs.artifact_name }}

  publish-wake:
    needs: wake
    if: needs.wake.outputs.report_ready == 'true' && !cancelled()
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish latest journal
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.wake.outputs.artifact_name }}
