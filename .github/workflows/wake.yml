# WAKE✳︎ MAINTAINER NOTE
# Cloud execution pipeline for one wake. Permissions, branch checkout, and state publication are part of continuity; automation must not bypass the record.
# Keep operational/configuration intent explicit for future human and AI maintainers.

name: WAKE✳︎ — research & journal
run-name: "WAKE✳︎ ${{ inputs.dispatch_token || github.event_name }}"

on:
  push:
    branches: [master]
    paths: ['wake/**', 'scripts/github_wake.py', 'wake.toml', 'research-topics.toml', '.github/workflows/wake.yml']
  # "GitHub scheduled auto WAKE✳︎ cycles: disabled"
  # schedule:
    # GitHub scheduled Actions are best effort and can be delayed or dropped.
    # Ask at the platform's five-minute cadence; durable state remains the
    # authority, so queued/delayed deliveries cannot create concurrent writers.
    # - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      publish_only:
        description: Refresh the website without calling Gemini
        type: boolean
        default: false
      reset:
        description: Irreversibly reset durable research/history to WAKE 0 and republish
        type: boolean
        default: false
      dispatch_token:
        description: Correlation token used by multi-operator batch dispatchers
        type: string
        required: false
        default: ''

concurrency:
  group: wake-durable-state
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  wake:
    # Set the repository variable WAKE_SCHEDULE_PAUSED=true to hold cron wakes
    # while preserving push refreshes and explicit workflow_dispatch batches.
    if: github.ref_name == github.event.repository.default_branch && (github.event_name != 'schedule' || vars.WAKE_SCHEDULE_PAUSED != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      report_ready: ${{ steps.report.outputs.ready }}
      artifact_name: ${{ steps.report.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Continue independent research
        id: cycle
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # Code updates refresh the record, scheduled ticks use the durable
        # high-frequency eligibility guard, and manual wakes always run when requested.
        run: |
          if [[ "${{ inputs.reset }}" == "true" ]]; then
            python scripts/github_wake.py --reset --confirm-reset
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            python scripts/github_wake.py --scheduled
          elif [[ "${{ github.event_name }}" == "push" || "${{ inputs.publish_only }}" == "true" ]]; then
            python scripts/github_wake.py --publish-only
          else
            python scripts/github_wake.py
          fi
      - name: Confirm report is ready
        id: report
        # A handled provider failure still produces a valid public report.
        if: always() && steps.cycle.outputs.skipped != 'true'
        run: |
          test -f site/index.html
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo 'artifact_name=github-pages-${{ github.run_id }}-${{ github.run_attempt }}' >> "$GITHUB_OUTPUT"
      - name: Configure Pages
        if: always() && steps.report.outcome == 'success'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Save the phone journal
        if: always() && steps.report.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: ${{ steps.report.outputs.artifact_name }}
      - name: Record run summary
        if: always()
        run: |
          if test -f site/operation.json; then
            cat site/operation.json >> "$GITHUB_STEP_SUMMARY"
          fi
      # scripts/github_wake.py returns nonzero only for conditions that deserve
      # operator attention. Expected provider pressure (429/quota exhaustion and
      # transient cross-model availability deferrals) remains durably recorded without paging.
      - name: Fail only when operator attention is required
        if: always() && steps.cycle.outcome == 'failure'
        run: exit 1

  publish:
    needs: wake
    if: always() && needs.wake.outputs.report_ready == 'true' && !cancelled()
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the latest journal
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.wake.outputs.artifact_name }}
