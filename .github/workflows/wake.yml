# WAKE✳︎ MAINTAINER NOTE
# Stateful research authority only. Pages publication is deliberately owned by
# pages.yml so model work, durable state mutation, and website deployment do not
# queue behind or cancel one another.

name: WAKE✳︎ — research & journal
run-name: "WAKE✳︎ ${{ inputs.dispatch_token || github.run_id }}"

on:
  workflow_dispatch:
    inputs:
      publish_only:
        description: Deprecated compatibility input; use the Pages workflow directly
        type: boolean
        default: false
      reset:
        description: Irreversibly reset durable research/history to WAKE 0 and republish
        type: boolean
        default: false
      dispatch_token:
        description: Correlation token used by multi-operator batch dispatchers
        type: string
        required: false
        default: ''
      publish_after:
        description: Request an independent Pages refresh after this wake
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: wake-durable-state
  cancel-in-progress: false
  queue: max

jobs:
  wake:
    if: github.ref_name == github.event.repository.default_branch && inputs.publish_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      skipped: ${{ steps.cycle.outputs.skipped }}
      publication_skipped: ${{ steps.cycle.outputs.publication_skipped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Continue independent research
        id: cycle
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WAKE_CONTROL_URL: ${{ vars.WAKE_CONTROL_URL }}
        run: |
          if [[ "${{ inputs.reset }}" == "true" ]]; then
            python scripts/github_wake.py --reset --confirm-reset
          else
            # Research writes only the durable record. Publication is an
            # independent read-only consumer dispatched after this job.
            python scripts/github_wake.py --record-only
          fi
      - name: Record run summary
        if: always()
        run: |
          if test -f site/operation.json; then
            cat site/operation.json >> "$GITHUB_STEP_SUMMARY"
          elif test -f operation.json; then
            cat operation.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Fail only when operator attention is required
        if: always() && steps.cycle.outcome == 'failure'
        run: exit 1

  request-publication:
    needs: wake
    if: |
      always() &&
      needs.wake.result == 'success' &&
      needs.wake.outputs.skipped != 'true' &&
      (inputs.publish_after == true || inputs.reset == true)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Request latest Pages publication
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref master -f "source_run_id=$SOURCE_RUN_ID"
