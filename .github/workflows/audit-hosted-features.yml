name: WAKE — Audit hosted feature settings
on:
  workflow_dispatch:
    inputs:
      probe_grounding:
        description: Make one public Google Search planning request in a disposable record.
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check -e '.[hosted]'
      - name: Read saved feature settings without changing records or controls
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WAKE_HOSTED_STATE_KEY: ${{ secrets.WAKE_HOSTED_STATE_KEY }}
          WAKE_HOSTED_STATE_DIR: /tmp/wake-feature-audit
          GEMINI_API_KEY: ${{ inputs.probe_grounding && secrets.GEMINI_API_KEY || '' }}
          PROBE_GROUNDING: ${{ inputs.probe_grounding }}
        run: |
          if [ "$PROBE_GROUNDING" = true ]; then
            python scripts/configure_hosted_features.py --audit --probe-grounding
          else
            python scripts/configure_hosted_features.py --audit
          fi
