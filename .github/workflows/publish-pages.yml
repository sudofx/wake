name: WAKE — Publish website
on:
  workflow_call:
    inputs:
      force:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild the checked interface even when already deployed.
        type: boolean
        default: false
  workflow_run:
    workflows: ["WAKE✳︎ — Check code · automatic"]
    types: [completed]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: wake-pages-delivery
  cancel-in-progress: false
jobs:
  publish:
    if: ((github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run') && inputs.force == true) || (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'master' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Select the latest checked master presentation
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/${{ github.repository }}/actions/workflows/test.yml/runs?branch=master&status=success&per_page=20" --jq '.workflow_runs | map(select(.head_branch == "master" and (.event == "push" or .event == "workflow_dispatch"))) | first | .head_sha')
          test "$sha" != null
          echo "revision=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.revision }}
          path: source
          persist-credentials: false
      - name: Skip unchanged website interfaces
        id: delivery
        env:
          GH_TOKEN: ${{ github.token }}
          PRESENTATION_REVISION: ${{ steps.source.outputs.revision }}
          PAGES_FORCE: ${{ inputs.force || 'false' }}
        run: python source/scripts/pages_delivery.py
      - uses: actions/checkout@v7
        if: steps.delivery.outputs.needed == 'true'
        with:
          ref: wake-public
          path: captured
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v7
        if: steps.delivery.outputs.needed == 'true'
        with:
          python-version: '3.13'
      - if: steps.delivery.outputs.needed == 'true'
        run: python -m pip install --disable-pip-version-check -e ./source
      - name: Keep research bytes and apply the independently checked interface
        if: steps.delivery.outputs.needed == 'true'
        run: |
          mkdir public-site
          git -C captured archive HEAD | tar -x -C public-site
          python source/scripts/prepare_pages.py --artifact public-site --repository '${{ github.repository }}' --revision '${{ steps.source.outputs.revision }}' --bounded-fallback
      - uses: actions/configure-pages@v5
        if: steps.delivery.outputs.needed == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.delivery.outputs.needed == 'true'
        with:
          path: public-site
      - name: Publish the checked website
        if: steps.delivery.outputs.needed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
