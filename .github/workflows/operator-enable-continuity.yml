name: WAKE✳︎ - Enable continuity campaign
run-name: "Enable WAKE✳︎ continuity campaign"

# Explicit operator opt-in for the continuity@1 7×7×7 campaign.
# This safely drains research, promotes the verified runtime, records enablement
# through WAKE's ordinary sudofx application boundary, then restores prior run state.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: wake-operator-control
  cancel-in-progress: false

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pin candidate and remember run state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')"
          latch="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/wake-runner.yml" --jq '.state')"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "was_running=$([[ "$latch" == "active" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Candidate: $candidate_sha" >> "$GITHUB_STEP_SUMMARY"
          echo "Continuation latch before enablement: $latch" >> "$GITHUB_STEP_SUMMARY"

      - name: Require successful automatic CI for candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.state.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            result="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs?head_sha=$CANDIDATE_SHA&event=push&per_page=20"               --jq '[.workflow_runs[] | select(.head_sha==env.CANDIDATE_SHA)] | sort_by(.created_at) | reverse | .[0] // {}')"
            status="$(jq -r '.status // "missing"' <<<"$result")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$result")"
            if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then
              echo "Automatic CI passed for $CANDIDATE_SHA." >> "$GITHUB_STEP_SUMMARY"
              break
            fi
            if [[ "$status" == "completed" && "$conclusion" != "success" ]]; then
              echo "::error::Automatic CI did not pass for $CANDIDATE_SHA (conclusion: $conclusion)."
              exit 1
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "::error::No successful automatic CI result became available for $CANDIDATE_SHA."
              exit 1
            fi
            sleep 5
          done

      - name: Close continuation latch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/wake-runner.yml" --jq '.state')"
          if [[ "$state" == "active" ]]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/wake-runner.yml/disable" >/dev/null
          fi
          echo "Continuation latch closed for governed enablement." >> "$GITHUB_STEP_SUMMARY"

      - name: Drain active research cycles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          empty_checks=0
          for attempt in {1..60}; do
            runtime_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/wake-runtime" --jq '.object.sha')"
            now_epoch="$(date -u +%s)"
            mapfile -t candidates < <(
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/wake.yml/runs?branch=wake-runtime&per_page=50"                 --jq ".workflow_runs[] | select(.head_branch==\"wake-runtime\" and .head_sha==\"$runtime_sha\" and .status!=\"completed\") | [.id,.created_at,.status] | @tsv"
            )
            real_runs=()
            for row in "${candidates[@]}"; do
              IFS=$'\t' read -r run_id created_at run_status <<<"$row"
              job_count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=1" --jq '.total_count' 2>/dev/null || echo 1)"
              created_epoch="$(date -u -d "$created_at" +%s)"
              age_seconds=$((now_epoch - created_epoch))
              if [[ "$run_status" == "queued" && "$job_count" == "0" && "$age_seconds" -ge 120 ]]; then
                echo "Ignoring stale queued zero-job WAKE run $run_id; it is not active research." >> "$GITHUB_STEP_SUMMARY"
                continue
              fi
              real_runs+=("$run_id")
            done
            if (( ${#real_runs[@]} == 0 )); then
              empty_checks=$((empty_checks + 1))
              if (( empty_checks >= 2 )); then
                echo "Research is fully stopped." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            else
              empty_checks=0
              for run_id in "${real_runs[@]}"; do
                gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null || true
              done
              if [[ "$attempt" == "10" ]]; then
                for run_id in "${real_runs[@]}"; do
                  gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/force-cancel" >/dev/null || true
                done
              fi
            fi
            sleep 2
          done
          echo "::error::Research did not fully drain before continuity enablement."
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.state.outputs.candidate_sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify exact candidate before promotion
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e .
          python -m unittest discover -s tests -v
          rm -rf /tmp/wake-continuity-enable /tmp/wake-continuity-enable-site
          python -m wake --data /tmp/wake-continuity-enable experiment --cycles 100 --output /tmp/wake-continuity-enable-site
          python -m wake audit --events /tmp/wake-continuity-enable-site/events.jsonl --head /tmp/wake-continuity-enable-site/head.txt

      - name: Promote exact verified candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.state.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          runtime_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/wake-runtime" --jq '.object.sha')"
          active="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/wake.yml/runs?branch=wake-runtime&per_page=50"             --jq "[.workflow_runs[] | select(.head_branch==\"wake-runtime\" and .head_sha==\"$runtime_sha\" and .status!=\"completed\")] | length")"
          test "$active" = "0" || { echo "::error::wake-runtime became active during verification."; exit 1; }
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/wake-runtime"             -f sha="$CANDIDATE_SHA" -F force=true >/dev/null
          promoted="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/wake-runtime" --jq '.object.sha')"
          test "$promoted" = "$CANDIDATE_SHA"
          echo "Promoted wake-runtime to $promoted." >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch governed continuity enablement
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.state.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          token="continuity-enable-$GITHUB_RUN_ID"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          gh workflow run wake.yml --repo "$GITHUB_REPOSITORY" --ref wake-runtime             -f "dispatch_token=$token"             -f "runtime_ref=$CANDIDATE_SHA"             -f "enable_continuity_matrix=true"
          echo "Governed continuity campaign enablement dispatched." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify continuity campaign was enabled
        env:
          GH_TOKEN: ${{ github.token }}
          TOKEN: ${{ steps.dispatch.outputs.token }}
        run: |
          set -euo pipefail
          run_id=""
          for attempt in {1..60}; do
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/wake.yml/runs?branch=wake-runtime&per_page=50"               --jq ".workflow_runs[] | select(.name == \"WAKE✳︎ $TOKEN\") | .id" | head -n1)"
            [[ -n "$run_id" ]] && break
            sleep 2
          done
          test -n "$run_id" || { echo "::error::Could not find continuity enablement run."; exit 1; }
          for attempt in {1..300}; do
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status')"
            if [[ "$status" == "completed" ]]; then
              conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.conclusion')"
              test "$conclusion" = "success" || { echo "::error::Continuity enablement run finished with $conclusion."; exit 1; }
              echo "continuity@1 campaign enablement is durable." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Continuity enablement did not finish before the safety timeout."
          exit 1

      - name: Restore prior continuous-run state
        if: steps.state.outputs.was_running == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.state.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/wake-runner.yml/enable" >/dev/null
          gh workflow run wake.yml --repo "$GITHUB_REPOSITORY" --ref wake-runtime             -f "dispatch_token=resume-after-continuity-$GITHUB_RUN_ID"             -f "runtime_ref=$CANDIDATE_SHA"
          echo "Research was running before enablement, so continuous research was resumed." >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve stopped state
        if: steps.state.outputs.was_running != 'true'
        run: echo "Research was stopped before enablement and remains stopped." >> "$GITHUB_STEP_SUMMARY"
