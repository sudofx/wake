name: WAKE✳︎ — continuous runner

run-name: "WAKE✳︎ continuous · ${{ inputs.dispatch_token || github.run_id }}"

# One bootstrap starts an immediate success-only chain. An hourly schedule is a
# recovery heartbeat so quota windows can reopen without an awake Mac. Disabling
# this workflow stops both the chain and the recovery heartbeat.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dispatch_token:
        description: Optional owner/operator correlation token
        type: string
        required: false
        default: ''

permissions:
  actions: write
  contents: read

concurrency:
  group: wake-continuous-runner
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      continue_now: ${{ steps.decision.outputs.continue_now }}
    steps:
      - name: Decide whether a scheduled recovery wake is due
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "schedule" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          encoded="$(gh api "repos/$GITHUB_REPOSITORY/contents/operation.json?ref=wake-state" --jq '.content' 2>/dev/null || true)"
          if [[ -z "$encoded" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          operation="$(tr -d '\n' <<<"$encoded" | base64 --decode 2>/dev/null || true)"
          status="$(jq -r '.status // empty' <<<"$operation" 2>/dev/null || true)"
          reason="$(jq -r '.reason // ""' <<<"$operation" 2>/dev/null || true)"
          next="$(jq -r '.wake_status.next_eligible // empty' <<<"$operation" 2>/dev/null || true)"
          if [[ "$status" == "paused" && "$reason" != *"Daily call ceiling"* && "$reason" != *"daily quota"* ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Scheduled recovery suppressed by operator-attention pause: $reason"
            exit 0
          fi
          if [[ -n "$next" ]]; then
            if ! python3 - "$next" <<'PY'
          import datetime, sys
          value=sys.argv[1].replace("Z","+00:00")
          target=datetime.datetime.fromisoformat(value)
          now=datetime.datetime.now(datetime.timezone.utc)
          raise SystemExit(0 if now >= target else 1)
          PY
            then
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Scheduled recovery is early; next eligible: $next"
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch one governed wake
        if: steps.preflight.outputs.run == 'true'
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          TOKEN: continuous-${{ github.run_id }}
        run: |
          set -euo pipefail
          gh workflow run wake.yml --repo "$GITHUB_REPOSITORY" --ref master \
            -f "dispatch_token=$TOKEN" -f "publish_after=true"
          title="WAKE✳︎ $TOKEN"
          run_id=""
          for _ in $(seq 1 120); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow wake.yml --event workflow_dispatch --branch master --limit 100 --json databaseId,displayTitle --jq ".[] | select(.displayTitle == \"$title\") | .databaseId" | head -n 1 || true)"
            [[ -n "$run_id" ]] && break
            sleep 5
          done
          [[ -n "$run_id" ]] || { echo "Dispatched wake was not discoverable." >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Wait for the exact wake
        if: steps.preflight.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 360); do
            status="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json status --jq '.status' 2>/dev/null || true)"
            [[ "$status" == "completed" ]] && break
            sleep 5
          done
          conclusion="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion' 2>/dev/null || true)"
          [[ "$conclusion" == "success" ]] || {
            echo "Governed wake $RUN_ID ended with: ${conclusion:-unknown}" >&2
            exit 1
          }

      - name: Read durable continuation receipt
        if: steps.preflight.outputs.run == 'true'
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          encoded=""
          for _ in $(seq 1 24); do
            encoded="$(gh api "repos/$GITHUB_REPOSITORY/contents/operation.json?ref=wake-state" --jq '.content' 2>/dev/null || true)"
            [[ -n "$encoded" ]] && break
            sleep 5
          done
          [[ -n "$encoded" ]] || { echo "Durable operation receipt unavailable." >&2; exit 1; }
          operation="$(tr -d '\n' <<<"$encoded" | base64 --decode)"
          status="$(jq -r '.status // empty' <<<"$operation")"
          reason="$(jq -r '.reason // ""' <<<"$operation")"
          quota="$(jq -r '.quota_exhausted // empty' <<<"$operation")"
          continue_now=false
          case "$status" in
            accepted|rejected)
              continue_now=true
              ;;
            deferred)
              if [[ "$reason" == Gemini\ temporarily\ unavailable* ]]; then
                sleep 15
                continue_now=true
              fi
              ;;
          esac
          if [[ "$quota" == "free_tier_daily" || "$quota" == "configured_daily_limit" ]]; then
            continue_now=false
          fi
          if [[ "$status" == "paused" || "$status" == "waiting" || "$status" == "failed" ]]; then
            continue_now=false
          fi
          echo "continue_now=$continue_now" >> "$GITHUB_OUTPUT"
          echo "WAKE receipt: status=$status · reason=$reason · continue_now=$continue_now"

  continue-again:
    needs: cycle
    if: needs.cycle.outputs.continue_now == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Start the next continuous cycle
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RUN_ID: ${{ github.run_id }}
        run: gh workflow run wake-runner.yml --repo "$GITHUB_REPOSITORY" --ref master -f "dispatch_token=continuous-$PREVIOUS_RUN_ID"
