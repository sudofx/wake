name: WAKE✳︎ — continuous runner
run-name: "WAKE✳︎ runtime bootstrap · ${{ inputs.dispatch_token || github.run_id }}"

# Compatibility/operator bootstrap only.
# This workflow never promotes code and never mutates wake-runtime.
# Runtime promotion is owned exclusively by promote-runtime.yml.
on:
  workflow_dispatch:
    inputs:
      dispatch_token:
        description: Optional operator correlation token
        type: string
        required: false
        default: ''
      runtime_ref:
        description: Deprecated compatibility input; ignored. Runtime always comes from wake-runtime.
        type: string
        required: false
        default: ''

permissions:
  actions: write
  contents: read

concurrency:
  group: wake-runner-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref_name == 'wake-runtime'
    steps:
      - name: Resolve the pinned runtime
        id: runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runtime_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/wake-runtime" --jq '.object.sha')"
          test -n "$runtime_ref"
          echo "runtime_ref=$runtime_ref" >> "$GITHUB_OUTPUT"
      - name: Dispatch one authoritative runtime cycle
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_REF: ${{ steps.runtime.outputs.runtime_ref }}
        run: |
          gh workflow run wake.yml --repo "$GITHUB_REPOSITORY" --ref wake-runtime \
            -f "dispatch_token=bootstrap-$GITHUB_RUN_ID" \
            -f "runtime_ref=$RUNTIME_REF" \
            -f "scheduled=false"
