name: WAKE✳︎ — INTERNAL · CONTINUATION LATCH
run-name: "WAKE✳︎ continuation latch"

# This workflow exists only because GitHub gives workflows a durable enabled/disabled state.
# START enables it. STOP disables it. wake.yml reads that state before dispatching a successor.
# Running this workflow manually does not start research.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explain:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain this internal latch
        run: echo "This workflow is only the continuous-research on/off latch. Use START CONTINUOUS RESEARCH to run WAKE✳︎."
