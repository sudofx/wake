name: WAKE✳︎ — continuous runner
run-name: "WAKE✳︎ continuous · ${{ inputs.dispatch_token || github.run_id }}"

# This workflow is only a bootstrap/recovery controller. One Start pins
# wake-runtime to the current implementation. Individual cycles chain themselves
# without waiting for this runner and never touch Pages.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dispatch_token:
        description: Optional owner/operator correlation token
        type: string
        required: false
        default: ''
      runtime_ref:
        description: Optional immutable commit to pin for this experiment chain
        type: string
        required: false
        default: ''

permissions:
  actions: write
  contents: write

concurrency:
  group: wake-runner-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pin or recover the experiment implementation
        id: runtime
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_REF: ${{ inputs.runtime_ref }}
          START_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            runtime_ref="${REQUESTED_REF:-$START_SHA}"
            ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/wake-runtime" 2>/dev/null || true)"
            if [[ -n "$ref_json" ]]; then
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/wake-runtime" -f "sha=$runtime_ref" -F force=true >/dev/null
            else
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref='refs/heads/wake-runtime' -f "sha=$runtime_ref" >/dev/null
            fi
          else
            runtime_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/wake-runtime" --jq '.object.sha' 2>/dev/null || true)"
            if [[ -z "$runtime_ref" ]]; then
              runtime_ref="$START_SHA"
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref='refs/heads/wake-runtime' -f "sha=$runtime_ref" >/dev/null
            fi
          fi
          echo "runtime_ref=$runtime_ref" >> "$GITHUB_OUTPUT"

      - name: Dispatch one pinned authoritative cycle
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_REF: ${{ steps.runtime.outputs.runtime_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          scheduled=false
          [[ "$EVENT_NAME" == "schedule" ]] && scheduled=true
          gh workflow run wake.yml --repo "$GITHUB_REPOSITORY" --ref wake-runtime             -f "dispatch_token=bootstrap-$GITHUB_RUN_ID"             -f "runtime_ref=$RUNTIME_REF"             -f "scheduled=$scheduled"
