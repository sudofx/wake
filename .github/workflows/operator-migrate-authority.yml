name: WAKE✳︎ - Migrate authority to sudofx
run-name: "Migrate WAKE authority to sudofx"

# Provider-free Phase E cutover. This workflow migrates the live wake-state
# database and stops. It does not start research, open the continuation latch,
# publish a research result, reset WAKE, or call Gemini.
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: wake-authority
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Refuse migration while research is active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/wake.yml/runs?branch=wake-runtime&per_page=50" \
            --jq '[.workflow_runs[] | select(.head_branch=="wake-runtime" and .status!="completed")] | length')"
          test "$active" = "0" || {
            echo "::error::WAKE research is active; refusing authority migration."
            exit 1
          }

      - name: Pin promoted runtime
        id: runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          master_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')"
          runtime_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/wake-runtime" --jq '.object.sha')"
          test "$master_sha" = "$runtime_sha" || {
            echo "::error::wake-runtime does not match master; promote verified code first."
            exit 1
          }
          echo "sha=$runtime_sha" >> "$GITHUB_OUTPUT"
          echo "Using promoted runtime $runtime_sha." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.runtime.outputs.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install promoted runtime
        run: python -m pip install --disable-pip-version-check -e .

      - name: Migrate and verify live authority without provider access
        run: python scripts/github_migrate_authority.py

      - name: Confirm research remains stopped
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/wake.yml/runs?branch=wake-runtime&per_page=50" \
            --jq '[.workflow_runs[] | select(.head_branch=="wake-runtime" and .status!="completed")] | length')"
          test "$active" = "0" || {
            echo "::error::A WAKE research run appeared during authority migration."
            exit 1
          }
          echo "Migration complete. WAKE research remains stopped." >> "$GITHUB_STEP_SUMMARY"
