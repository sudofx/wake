name: WAKE — Recover hosted handoff

on:
  workflow_run:
    # Run events can carry the dynamic run-name. Match that known namespace as
    # well as the static workflow name, then verify the exact file below.
    workflows: ['WAKE — Hosted research', 'WAKE hosted *']
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      predecessor:
        description: Research run whose successor needs recovery.
        type: string
        required: true

permissions:
  contents: read
  actions: write

# Serialize with normal successor dispatch; duplicate completion events cannot
# create a second writer. No cron trigger is used.
concurrency:
  group: wake-hosted-handoff
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.path == '.github/workflows/hosted-research.yml' &&
       github.event.workflow_run.conclusion != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Back off before repairing a failed or cancelled handoff
        run: sleep 120
      - name: Install the application dependencies
        run: python -m pip install --disable-pip-version-check -e .
      - name: Reconcile the successor before retrying dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PREDECESSOR: ${{ inputs.predecessor || github.event.workflow_run.id }}
        run: python scripts/github_research.py continue --predecessor "$PREDECESSOR"
