name: research-worker
# Keep the event name stable for independent completion recovery. Successor
# reconciliation uses monotonic workflow run numbers, not display titles.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Internal worker dispatch. Use research-control to operate WAKE.
        type: choice
        options: [continue, reset]
        default: continue

permissions:
  contents: write
  actions: write

# One writer for the whole installation, including restore and final capture.
# The retired hosted-research workflow stays disabled: its unstarted runs consult
# that live stop latch before opening records or admitting provider effects.
concurrency:
  group: wake-research-authority
  cancel-in-progress: false

jobs:
  research:
    if: github.ref_name == 'master' && github.actor == 'github-actions[bot]' && github.triggering_actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      WAKE_HOSTED_STATE_DIR: /tmp/wake-hosted-transport
      WAKE_INSTALLATION_DATA: /tmp/wake-hosted-installation
      WAKE_HOSTED_ARTIFACT: /tmp/wake-hosted-public
      WAKE_DEV_RELOAD: 'false'
      WAKE_HOSTED_STATE_KEY: ${{ secrets.WAKE_HOSTED_STATE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RESET_EXPERIMENT: ${{ inputs.mode == 'reset' }}
    steps:
      - name: Select the runtime bound to this workflow revision
        id: runtime
        run: |
          revision=$(gh api "repos/$GITHUB_REPOSITORY/contents/hosted-runtime.json?ref=$GITHUB_SHA" --jq .content |
            base64 -d | jq -er --arg repo "$GITHUB_REPOSITORY" '.installations[$repo].source_revision | select(test("^[a-f0-9]{40}$"))')
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.runtime.outputs.revision }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install hosted transport and native application
        run: python -m pip install --disable-pip-version-check -e '.[hosted]'
      - name: Verify isolated computational instruments
        run: |
          if [ -f tests/test_scientific_isolation.py ]; then
            docker pull python@sha256:a1165e272e578941b84abc79e4ab38a0305cd12803a5c4247979ac7655f4d641
            PYTHONPATH=tests python -m unittest test_scientific_isolation -v
          fi
      - name: Restore, research, checkpoint, and publish
        env:
          WAKE_SOURCE_REVISION: ${{ steps.runtime.outputs.revision }}
        run: |
          if [ "$RESET_EXPERIMENT" = true ]; then
            python scripts/github_research.py run --reset
          else
            python scripts/github_research.py run
          fi
      - name: Report bounded startup failure diagnostics
        if: failure()
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          root = Path(os.environ['WAKE_INSTALLATION_DATA'])
          for path in [root / 'controller.log', *sorted(root.glob('nodes/*/worker.log'))]:
              with path.open('rb') as stream:
                  stream.seek(max(0, path.stat().st_size - 32768))
                  lines = stream.read(32768).decode('utf-8', errors='replace').splitlines()
              # Only source locations and exception classes. Never log request
              # bodies, exception messages, credentials or authority contents.
              frames = []
              errors = []
              for line in lines:
                  frame = re.fullmatch(r'  File ".*?/(wake|scripts)/([A-Za-z0-9_/.]+\.py)", line ([0-9]+), in ([A-Za-z0-9_<>]+)', line)
                  if frame:
                      frames.append({'source': frame[1] + '/' + frame[2], 'line': int(frame[3]), 'function': frame[4]})
                  error = re.match(r'^([A-Za-z_][A-Za-z0-9_]*(?:Error|Exception)):', line)
                  if error:
                      errors.append(error[1])
              print(json.dumps({'hosted_failure_log': str(path.relative_to(root)),
                                'bytes': path.stat().st_size, 'frames': frames[-12:], 'errors': errors[-4:]}))
          for path in sorted(root.glob('nodes/*/runtime.json')):
              try:
                  value = json.loads(path.read_bytes()[:32768])
                  state = value.get('state')
                  print(json.dumps({'hosted_failure_node': path.parent.name,
                                    'state': state if state in ('stopped','paused','running','waiting','standby','blocked','unavailable') else 'unknown'}))
              except (OSError, ValueError):
                  pass
          PY
  continue:
    needs: research
    if: always() && !cancelled() && needs.research.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency:
      group: wake-research-handoff
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Allow transient failures to settle
        if: needs.research.result != 'success'
        run: sleep 120
      - name: Install the application dependencies
        run: python -m pip install --disable-pip-version-check -e .
      - name: Explicitly dispatch the next research run
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/github_research.py continue --predecessor '${{ github.run_id }}'
