name: WAKE✳︎ — STOP CONTINUOUS RESEARCH
run-name: "STOP continuous WAKE✳︎ research"

# ELI5: Press this when you want WAKE✳︎ to stop making new research cycles.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: wake-operator-stop
  cancel-in-progress: false

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close the continuation latch first
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/wake-runner.yml/disable" >/dev/null

      - name: Cancel any active research cycle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t runs < <(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/wake.yml/runs?branch=wake-runtime&per_page=50"             --jq '.workflow_runs[] | select(.head_branch=="wake-runtime" and .status!="completed") | .id')
          for run_id in "${runs[@]}"; do
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null || true
          done
          echo "Cancelled ${#runs[@]} active WAKE cycle(s)." >> "$GITHUB_STEP_SUMMARY"

      - name: Explain the result
        run: echo "WAKE✳︎ is stopped. No successor cycle will be dispatched until START CONTINUOUS RESEARCH is run." >> "$GITHUB_STEP_SUMMARY"
