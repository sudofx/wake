name: WAKE✳︎ — authorized live start

on:
  push:
    paths:
      - '.github/workflows/start-live-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Enable continuous runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable wake-runner.yml --repo "$GITHUB_REPOSITORY"
      - name: Start pinned live experiment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run wake-runner.yml --repo "$GITHUB_REPOSITORY" --ref master \
            -f "dispatch_token=authorized-live-${GITHUB_RUN_ID}" \
            -f "runtime_ref=22789511f702acdb8139900654e701a7b9483c77"
