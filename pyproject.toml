# WAKE✳︎ MAINTAINER NOTE
# Python package and test metadata. Keep build/environment behavior explicit and reproducible.
# Comments here document operational intent so future maintainers do not mistake configuration for experimental evidence.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wake"
version = "0.20.0"
description = "Disposable models. Durable state. Receipts for everything."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
wake = "wake.__main__:main"

[tool.setuptools]
packages = ["wake"]
include-package-data = true

[tool.setuptools.package-data]
wake = ["assets/*"]
