# Package metadata and runtime dependencies. Optional hosted transport is installed separately.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wake"
version = "0.21.0"
description = "Infrastructure for durable, accountable work across interchangeable intelligences."
requires-python = ">=3.11"
dependencies = [
  "pypdf==6.19.0",
]

[project.optional-dependencies]
hosted = ["cryptography==50.0.2"]

[project.scripts]
wake = "wake.__main__:main"
wake-research = "wake.installation_cli:main"

[tool.setuptools]
packages = ["wake", "wake.kernel"]
include-package-data = true

[tool.setuptools.package-data]
# Wheels must contain the same site resources as checkout execution. Explicit
# nested patterns prevent source-tree imports from hiding incomplete packaging.
wake = ["assets/*", "assets/icons/*", "assets/backgrounds/*", "assets/backgrounds/previews/*", "assets/inspection/*"]
