# WAKE✳︎ MAINTAINER NOTE
# Python package and test metadata. Keep build/environment behavior explicit and reproducible.
# Comments here document operational intent so future maintainers do not mistake configuration for experimental evidence.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wake"
version = "0.21.0"
description = "Infrastructure for durable, accountable work across interchangeable intelligences."
requires-python = ">=3.11"
dependencies = [
  "pypdf==6.19.0",
]

[project.scripts]
wake = "wake.__main__:main"

[tool.setuptools]
packages = ["wake", "wake.kernel"]
include-package-data = true

[tool.setuptools.package-data]
# Wheels must contain the same site resources as checkout execution. Explicit
# nested patterns prevent source-tree imports from hiding incomplete packaging.
wake = ["assets/*", "assets/icons/*", "assets/backgrounds/*", "assets/backgrounds/previews/*"]
