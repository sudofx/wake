services:
  wake:
    build: .
    image: wake-standalone:local
    ports:
      - "127.0.0.1:${WAKE_PORT:-8080}:8080"
    volumes:
      - wake-data:/data
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      WAKE_PROVIDER: ${WAKE_PROVIDER:-gemini}
      WAKE_MODEL: ${WAKE_MODEL:-}
      WAKE_INTERVAL_SECONDS: ${WAKE_INTERVAL_SECONDS:-60}
      WAKE_PAUSED: ${WAKE_PAUSED:-false}
    restart: unless-stopped
    stop_grace_period: 5m
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  wake-data:
