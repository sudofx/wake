# Explicit routes are operator configuration, never application authority.
# Match each upstream to a unique Compose project alias. Docker DNS is resolved
# per request so replacing a container does not pin an obsolete container IP.
pid /tmp/nginx.pid;
events {}
http {
    access_log /dev/stdout;
    error_log /dev/stderr;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;
    map $host $wake_upstream {
        default "";
        alpha.wake.test wake-alpha:8080;
        beta.wake.test wake-beta:8080;
    }
    server {
        listen 8080 default_server;
        server_name _;
        if ($wake_upstream = "") { return 404; }
        location / {
            proxy_pass http://$wake_upstream;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
